plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.ksp)
    alias(libs.plugins.protobuf)
}

def base = '../launcher3-base'
def baseSrc = ['/src', '/src_no_quickstep', '/src_plugins', '/shared/src', '/modules/appfunctions/src', '/modules/concurrent/src',
    '/dagger/src', '/tests/shared/src'].collect { base + it }

android {
    namespace 'com.android.launcher3'
    compileSdk { version = release(37) { minorApiLevel = 0 } }
    defaultConfig {
        applicationId 'com.qtekfun.ultimatelauncher'
        minSdk 31
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
        // Equivalentes a tools/buildconfig.sh de Launcher3 (valores por defecto de AOSP, salvo QSB).
        buildConfigField 'boolean', 'IS_STUDIO_BUILD', 'false'
        buildConfigField 'boolean', 'IS_DEBUG_DEVICE', 'false'
        buildConfigField 'boolean', 'WIDGETS_ENABLED', 'true'
        buildConfigField 'boolean', 'NOTIFICATION_DOTS_ENABLED', 'true'
        // RF-03: sin barra de búsqueda (QSB) en la primera pantalla.
        buildConfigField 'boolean', 'QSB_ON_FIRST_SCREEN', 'false'
    }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; coreLibraryDesugaringEnabled = true }
    buildFeatures { buildConfig = true; compose = true; aidl = true; resValues = true }

    // Lint como compuerta de compatibilidad (R1, docs/compat-android12-14.md): NewApi es ERROR y no se admite en la línea base.
    // El ruido heredado de AOSP (traducciones, recursos sin uso, restos de quickstep) se desactiva por id: sin línea base, así
    // cualquier error NUEVO de Lint rompe la compilación. Si se necesitara una línea base: añadir `baseline = file('lint-baseline.xml')`
    // y generarla con ./gradlew :app:updateLintBaselineDefaultDebug, comprobando que NO contiene NewApi.
    lint {
        abortOnError = true
        warningsAsErrors = false
        checkDependencies = false
        error += ['NewApi']
        disable += [
            'StringFormatMatches', 'StringFormatInvalid', 'MissingTranslation', 'ExtraTranslation', 'UnusedResources',
            'ResAuto', 'MissingClass', 'ThreadConstraint', 'UseAppTint', 'ResourceType', 'AppCompatCustomView', 'RestrictedApi',
            'GestureBackNavigation', 'Range', 'WrongConstant', 'NotificationPermission', 'ProtectedPermissions',
        ]
    }

    buildTypes {
        release {
            // Para pruebas locales se firma con la clave de depuración. La clave de release propia va fuera del repo (docs/03).
            signingConfig signingConfigs.debug
            // R8 (reducción de código): APAGADO por defecto porque no se ha probado en un dispositivo (la compilación y el análisis
            // estático pasan; 66 MB -> 10,5 MB). Para probarlo: ./gradlew -Pul.minify=true :app:assembleDefaultRelease.
            // Ver docs/arranque-en-frio.md y app/proguard-rules.pro.
            minifyEnabled project.hasProperty('ul.minify') && project.property('ul.minify') == 'true'
            proguardFiles 'proguard-rules.pro'
        }
    }

    flavorDimensions += 'dist'
    productFlavors {
        'default' { dimension 'dist' }
        sync { dimension 'dist'; applicationIdSuffix '.sync' }
    }

    sourceSets {
        // Perfil de animación generado (tools/apply-anim-profile.py): superpone recursos de AOSP en ambas variantes.
        'default' { res.directories.addAll(['../animprofile/res', '../themetokens/res']) }
        sync { res.directories.addAll(['../animprofile/res', '../themetokens/res']) }
        main {
            java.directories.addAll(baseSrc)
            kotlin.directories.addAll(baseSrc)
            res.directories.addAll([(base + '/res')])
            proto { srcDirs = [(base + '/protos'), (base + '/protos_overrides')] }
        }
    }
}

protobuf {
    protoc { artifact = libs.protobuf.protoc.get().toString() }
    generateProtoTasks { all().configureEach { task -> task.builtins { java { option "lite" } } } }
}

dependencies {
    ['iconloaderlib', 'animationlib', 'msdllib', 'dynamiccolors', 'usertypelib'].each { implementation project(":$it") }
    implementation project(':platform-stubs')
    implementation project(':widgetpicker')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.core.animation
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.dynamicanimation
    implementation libs.androidx.fragment
    implementation libs.androidx.preference
    implementation libs.androidx.slice.view
    implementation libs.androidx.slice.core
    implementation libs.androidx.graphics.shapes
    implementation libs.androidx.appfunctions
    implementation libs.androidx.appfunctions.service
    ksp libs.androidx.appfunctions.compiler
    implementation libs.androidx.cardview
    implementation libs.androidx.window
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.extensions
    implementation libs.androidx.navigation.compose
    implementation libs.material
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.compose.material.icons
    implementation libs.compose.runtime
    implementation libs.compose.runtime.livedata
    implementation libs.kotlinx.coroutines.android
    implementation libs.guava
    implementation libs.javax.inject
    implementation libs.jsr305
    implementation libs.dagger
    ksp libs.dagger.compiler
    implementation libs.protobuf.javalite
    coreLibraryDesugaring libs.desugar.jdk.libs
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
