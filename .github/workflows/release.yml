# SPDX-License-Identifier: GPL-3.0-or-later
#
# Publica una release de GitHub firmada al empujar una etiqueta vX.Y.Z (o vX.Y.Z-rc.N). Las notas salen de CHANGELOG.md.
# Secretos del repo (ver docs/release-signing.md): UL_KEYSTORE_BASE64, UL_KEYSTORE_PASSWORD, UL_KEY_ALIAS, UL_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 cmdline-tools;latest'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Comprobar que la etiqueta coincide con versionName
        run: |
          version=$(sed -n "s/^ *versionName '\(.*\)'.*/\1/p" app/build.gradle | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "La etiqueta $GITHUB_REF_NAME no coincide con versionName $version"; exit 1; }

      - name: CI completo (compilación, pruebas, Lint y auditoría de privacidad)
        run: tools/ci.sh

      - name: Compilar la release firmada (variante default)
        env:
          UL_KEYSTORE_BASE64: ${{ secrets.UL_KEYSTORE_BASE64 }}
          UL_KEYSTORE_PASSWORD: ${{ secrets.UL_KEYSTORE_PASSWORD }}
          UL_KEY_ALIAS: ${{ secrets.UL_KEY_ALIAS }}
          UL_KEY_PASSWORD: ${{ secrets.UL_KEY_PASSWORD }}
        run: |
          test -n "$UL_KEYSTORE_BASE64" || { echo "Falta UL_KEYSTORE_BASE64: no se publica una release sin firmar"; exit 1; }
          export UL_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$UL_KEYSTORE_BASE64" | base64 -d > "$UL_KEYSTORE_FILE"
          ./gradlew :app:assembleDefaultRelease
          rm -f "$UL_KEYSTORE_FILE"

      - name: Comprobar la firma del APK
        run: |
          apk=app/build/outputs/apk/default/release/app-default-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q "CN=UltimateLauncher" certs.txt || { echo "El APK no está firmado con la clave de publicación"; exit 1; }

      - name: Publicar la release de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md no tiene notas para $version"; exit 1; }
          apk="UltimateLauncher-$version.apk"
          cp app/build/outputs/apk/default/release/app-default-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          prerelease=""
          case "$version" in *-rc.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --title "UltimateLauncher $version" --notes-file notes.md $prerelease
