# SPDX-License-Identifier: GPL-3.0-or-later
#
# Integración continua de UltimateLauncher (docs/07 «Integración continua», docs/09 «Auditoría de privacidad»).
# Toda la lógica vive en tools/ci.sh, de modo que el mismo comando sirve en local (OFFLINE=1) y aquí. Sin secretos:
# la release de CI se firma con la clave de depuración; la firma real se hace aparte (docs/release-signing.md).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # SDK de Android: plataforma 37.0, build-tools 36.0.0 y cmdline-tools (apkanalyzer para la auditoría).
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 cmdline-tools;latest'

      # También valida el checksum del wrapper de Gradle.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compilar, pruebas, Lint y auditoría de privacidad
        run: tools/ci.sh

      - name: Subir el APK de la variante default (release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UltimateLauncher-default-release-apk
          path: app/build/outputs/apk/default/release/app-default-release.apk
          retention-days: 14

      - name: Subir informes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
